name: Update screenshots

# Takes new visual baselines (e2e/visual.spec.ts) on Linux and commits them to the branch it
# runs on. Run it from the Actions tab after a change that alters how fields look, then review
# the changed images in the pull request. Commits made with GITHUB_TOKEN do not start CI; push
# again or re-run CI to check the new baselines.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the docs sites and the SSR check
        run: |
          npm run build:dropdown
          npx ng build demo
          npx ng build ngu-dropdown-demo
          npx ng build ngu-table-demo
          npx ng build ssr-check
      - name: Take screenshots
        run: npx playwright test -c e2e --project=visual --update-snapshots=all
      - name: Commit changed baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/snapshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "Update screenshot baselines"
            git push
          fi
