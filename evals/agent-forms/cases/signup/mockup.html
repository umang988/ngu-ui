<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sign up</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f4f6; font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #111827; }
  .card { width: 440px; margin: 40px auto; background: #fff; border-radius: 16px; padding: 36px 36px 28px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(17,24,39,.06); }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; margin-bottom: 20px; }
  .logo i { width: 26px; height: 26px; border-radius: 7px; background: #4f46e5; display: inline-block; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: #6b7280; margin: 0 0 24px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-weight: 500; font-size: 13px; margin-bottom: 6px; color: #374151; }
  label .req { color: #dc2626; margin-left: 2px; }
  .input { height: 40px; border: 1px solid #d1d5db; border-radius: 8px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; color: #9ca3af; background: #fff; }
  .input.filled { color: #111827; }
  .hint { color: #6b7280; font-size: 12px; margin-top: 6px; }
  .eye { width: 18px; height: 18px; color: #9ca3af; }
  .chev { color: #6b7280; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 22px; color: #374151; }
  .box { width: 16px; height: 16px; border: 1px solid #9ca3af; border-radius: 4px; flex: none; margin-top: 2px; }
  .check a { color: #4f46e5; text-decoration: none; font-weight: 500; }
  button { width: 100%; height: 42px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font: 600 14px/1 inherit; }
  .foot { text-align: center; color: #6b7280; margin-top: 18px; }
  .foot a { color: #4f46e5; font-weight: 500; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><i></i>Acme</div>
    <h1>Create your account</h1>
    <p class="sub">Start your 14-day free trial. No credit card required.</p>
    <div class="row">
      <div class="field"><label>First name<span class="req">*</span></label><div class="input"></div></div>
      <div class="field"><label>Last name<span class="req">*</span></label><div class="input"></div></div>
    </div>
    <div class="field"><label>Work email<span class="req">*</span></label><div class="input">you@company.com</div></div>
    <div class="field">
      <label>Password<span class="req">*</span></label>
      <div class="input">••••••••
        <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <div class="hint">At least 8 characters, including a number.</div>
    </div>
    <div class="field"><label>Company size</label><div class="input filled">1–10 employees <span class="chev">⌄</span></div></div>
    <div class="check"><span class="box"></span><span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a><span style="color:#dc2626">*</span></span></div>
    <button>Create account</button>
    <p class="foot">Already have an account? <a href="#">Sign in</a></p>
  </div>
</body>
</html>
