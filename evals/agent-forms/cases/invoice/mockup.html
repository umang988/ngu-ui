<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Invoice</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f0fdfa; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; color: #134e4a; }
  .card { width: 880px; margin: 32px auto; background: #fff; border-radius: 10px; padding: 30px 32px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0; color: #042f2e; }
  .badge { background: #ccfbf1; color: #0f766e; border-radius: 999px; padding: 2px 10px; font-weight: 600; font-size: 12px; }
  .grid3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px; margin-bottom: 26px; }
  label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #134e4a; }
  .req { color: #dc2626; }
  .input { height: 38px; border: 1px solid #cbd5d4; border-radius: 6px; padding: 0 10px; display: flex; align-items: center; justify-content: space-between; color: #0f172a; }
  .muted { color: #94a3b8; }
  h2 { font-size: 15px; margin: 0 0 10px; color: #042f2e; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #5f7f7c; padding: 8px 6px; border-bottom: 1px solid #e2e8f0; }
  td { padding: 8px 6px; border-bottom: 1px solid #f1f5f9; }
  td .input { height: 34px; }
  .num { text-align: right; }
  .trash { color: #94a3b8; text-align: center; }
  .add { color: #0d9488; font-weight: 600; display: inline-block; margin: 6px 0 24px; }
  .area { height: 80px; border: 1px solid #cbd5d4; border-radius: 6px; }
  .actions { display: flex; justify-content: flex-end; margin-top: 24px; }
  button { background: #0d9488; color: #fff; border: 0; border-radius: 6px; height: 40px; padding: 0 22px; font: 600 14px/1 inherit; }
</style>
</head>
<body>
  <div class="card">
    <div class="top"><h1>New invoice</h1><span class="badge">INV-0042</span></div>
    <div class="grid3">
      <div><label>Client <span class="req">*</span></label><div class="input"><span class="muted">Select a client</span><span>⌄</span></div></div>
      <div><label>Invoice date <span class="req">*</span></label><div class="input">10/13/2026 <span>📅</span></div></div>
      <div><label>Due date <span class="req">*</span></label><div class="input">11/12/2026 <span>📅</span></div></div>
    </div>
    <h2>Line items</h2>
    <table>
      <thead><tr><th style="width:52%">Description</th><th style="width:12%">Qty</th><th style="width:22%">Unit price</th><th style="width:6%"></th></tr></thead>
      <tbody>
        <tr><td><div class="input">Website redesign</div></td><td><div class="input">1</div></td><td><div class="input">1500.00</div></td><td class="trash">🗑</td></tr>
        <tr><td><div class="input">Hosting (12 months)</div></td><td><div class="input">12</div></td><td><div class="input">25.00</div></td><td class="trash">🗑</td></tr>
      </tbody>
    </table>
    <span class="add">+ Add line item</span>
    <label>Notes</label>
    <div class="area"></div>
    <div class="actions"><button>Save invoice</button></div>
  </div>
</body>
</html>
